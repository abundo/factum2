# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: factum2

# factum2-web's //go:embed of web/static (including the Vue SPA) requires the
# frontend to be built first. Other binaries ignore that directory.
before:
    hooks:
        - npm --prefix web/frontend ci
        - npm --prefix web/frontend run build

builds:
    - id: factum2
      main: ./cmd/factum2
      binary: factum2
      env: [CGO_ENABLED=0]
      goos: [linux]
      goarch: [amd64, arm64]
      flags: [-trimpath]
      ldflags:
          - -s -w -X github.com/abundo/factum2/internal/buildinfo.Version={{.Version}} -X github.com/abundo/factum2/internal/buildinfo.Commit={{.Commit}} -X github.com/abundo/factum2/internal/buildinfo.Date={{.CommitDate}}

    - id: factum2-becs
      main: ./cmd/becs
      binary: factum2-becs
      env: [CGO_ENABLED=0]
      goos: [linux]
      goarch: [amd64, arm64]
      flags: [-trimpath]
      ldflags:
