archives:
    - formats: [tar.gz]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          - README.md
          - examples/*
          - install.py

checksum:
    name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
    sort: asc
    use: git
    filters:
        exclude:
            - "^Merge pull request"
            - "^Merge branch"

release:
    github:
        owner: abundo
        name: factum2
    name_template: "v{{ .Version }}"
