  - id: factum-oxidized
    main: ./cmd/oxidized
    binary: factum-oxidized
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/abundo/factum2/internal/buildinfo.Version={{.Version}} -X github.com/abundo/factum2/internal/buildinfo.Commit={{.Commit}} -X github.com/abundo/factum2/internal/buildinfo.Date={{.CommitDate}}

  - id: factum-web
    main: ./cmd/web
    binary: factum-web
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    tags: [release]
    ldflags:
      - -s -w -X github.com/abundo/factum2/internal/buildinfo.Version={{.Version}} -X github.com/abundo/factum2/internal/buildinfo.Commit={{.Commit}} -X github.com/abundo/factum2/internal/buildinfo.Date={{.CommitDate}}

  - id: factum-worker
    main: ./cmd/worker
    binary: factum-worker
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/abundo/factum2/internal/buildinfo.Version={{.Version}} -X github.com/abundo/factum2/internal/buildinfo.Commit={{.Commit}} -X github.com/abundo/factum2/internal/buildinfo.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/*

nfpms:
  - maintainer: Anders Lowinger <anders@abundo.se>
    description: Factum network infrastructure manager and sync tools.
    homepage: https://github.com/abundo/factum2
    license: AGPL-3.0-or-later
    formats:
      - deb
    bindir: /opt/factum2
    section: net
    contents:
      - src: LICENSE
        dst: /usr/share/doc/factum2/copyright
      - src: examples/factum2.yaml
        dst: /usr/share/doc/factum2/factum2.yaml
      - src: examples/factum2-worker.yaml
        dst: /usr/share/doc/factum2/factum2-worker.yaml
      - src: examples/icinga-notification-email.tpl
        dst: /usr/share/doc/factum2/icinga-notification-email.tpl
      - src: examples/factum2-web.service
        dst: /lib/systemd/system/factum2-web.service
      - src: examples/factum2-worker.service
        dst: /lib/systemd/system/factum2-worker.service
      - dst: /etc/factum2
        type: dir

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: abundo
    name: factum2
  name_template: "v{{ .Version }}"
