# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: factum2

# factum2-web's //go:embed of web/static (the Vue SPA and Wiregasm) requires
# both trees to exist first. Other binaries ignore that directory.
before:
    hooks:
        - npm --prefix web/frontend ci
        - npm --prefix web/frontend run build
        # Wiregasm (GPL-2.0) is not an npm dependency of the GUI. This
        # downloads the pinned build into web/static/wiregasm so the
        # release factum2-web embeds it.
        - make wiregasm
        # Inventory is //go:embed'd into factum2-web (`docs/sbom_release.go`).
        - go run ./internal/sbom/gensbom -o docs/generated/sbom.md

# {{.Version}} is the tag without a leading v (git tag v1.0.6 → 1.0.6).
# Makefile ldflags use `git describe` (keeps the v). Hub handshake and
# install.py treat those as the same stamp.
builds:
    - id: factum2
      main: ./cmd/factum2
      binary: factum2
      env: [CGO_ENABLED=0]
      goos: [linux]
      goarch: [amd64]
      flags: [-trimpath]
      ldflags:
          - -s -w -X github.com/abundo/factum2/internal/buildinfo.Version={{.Version}} -X github.com/abundo/factum2/internal/buildinfo.Commit={{.Commit}} -X github.com/abundo/factum2/internal/buildinfo.Date={{.CommitDate}}

    - id: factum2-becs
