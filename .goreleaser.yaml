  - id: factum-icinga-notifications
    main: ./cmd/icinga-notifications
    binary: factum-icinga-notifications
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
