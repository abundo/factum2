name: ci

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Vet
              run: go vet $(go list ./... | grep -v /node_modules/)

            - name: Test
              run: make test

            - name: Build
              run: make
