name: release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: factum2
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  path: factum2

            - name: Checkout limetool
              uses: actions/checkout@v7
              with:
                  repository: abundo/limetool
                  path: limetool

            - name: Checkout netboxtool
              uses: actions/checkout@v7
              with:
                  repository: abundo/netboxtool
                  path: netboxtool

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: factum2/go.mod
                  cache-dependency-path: factum2/go.sum

            - name: Vet
              run: go vet $(go list ./... | grep -v /node_modules/)

            - name: Test
              run: make test

    goreleaser:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  path: factum2

            - name: Checkout limetool
              uses: actions/checkout@v7
              with:
                  repository: abundo/limetool
                  path: limetool

            - name: Checkout netboxtool
              uses: actions/checkout@v7
              with:
                  repository: abundo/netboxtool
                  path: netboxtool

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: factum2/go.mod
                  cache-dependency-path: factum2/go.sum

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: factum2/web/frontend/package-lock.json

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v7
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean
                  workdir: factum2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
