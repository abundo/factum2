---
# token can be generated with
# openssl rand -base64 32
#
# factum.url/token are Stat/Dial fallback for co-located CLIs (socket
# missing, unreadable, or undialable). They are NOT a retry path for unix
# 502/timeout after Dial succeeded. Omit both on start-only hosts once
# CLIs use the socket. factum2-worker run still needs them (HTTPS).
factum:
    url: https://factum.example.com
    token: <change-me>
    # socket: none   # force HTTPS (same as FACTUM_WORKER_API_SOCKET=none)

# on each worker, adjust the commands to what the worker handles
# this token is for the primary server accessing this worker
#
# Hub is WSS only. install.py generates a CA on the primary and writes
# hub.crt/hub.key here (SAN = this node's Address). Re-run the installer
# after registering the node. Manual fallback:
#   sudo openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
#     -keyout /etc/factum2/hub.key -out /etc/factum2/hub.crt \
#     -subj "/CN=worker.example.com" \
#     -addext "subjectAltName=DNS:worker.example.com"
worker:
    listen: ":8443"
    token: <change-me>
    tls_cert: /etc/factum2/hub.crt
    tls_key: /etc/factum2/hub.key
    # api_socket:  (default /run/factum2-worker/api.sock; relocate via
    # FACTUM_WORKER_API_SOCKET on the worker unit AND in CLI environments —
    # do not set only worker.api_socket or only factum.socket)
    commands:
        becs:
            cmd: /opt/factum2/factum2-becs
            args: ["sync", "--job"]
        device-sync:
            cmd: /opt/factum2/factum2-device-sync
            args: ["sync", "--job"]
        dns:
            cmd: /opt/factum2/factum2-dns
            args: ["sync", "--job"]
        icinga:
            cmd: /opt/factum2/factum2-icinga
            args: ["sync", "--job"]
        librenms:
            cmd: /opt/factum2/factum2-librenms
            args: ["sync", "--job"]
        prometheus:
            cmd: /opt/factum2/factum2-prometheus
            args: ["sync", "--job"]
        lime:
            cmd: /opt/factum2/factum2-lime
            args: ["sync", "--job"]
        netbox:
            cmd: /opt/factum2/factum2-netbox
            args: ["sync", "--job"]
