---
# token can be generated with
# openssl rand -base64 32
#
# factum.url/token are Stat/Dial fallback for co-located CLIs (socket
# missing, unreadable, or undialable). They are NOT a retry path for unix
# 502/timeout after Dial succeeded. Omit both on start-only hosts once
# CLIs use the socket. factum-worker run still needs them (HTTPS).
factum:
  url: https://factum.example.com
  token: <change-me>
  # socket: none   # force HTTPS (same as FACTUM_WORKER_API_SOCKET=none)

# on each worker, adjust the commands to what the worker handles
# this token is for the primary server accessing this worker
worker:
  listen: ":8443"
  token: <change-me>
  # api_socket:  (default /run/factum-worker/api.sock; relocate via
  # FACTUM_WORKER_API_SOCKET on the worker unit AND in CLI environments —
  # do not set only worker.api_socket or only factum.socket)
  commands:
    becs:
      cmd: /opt/factum2/factum-becs
      args: [ "sync", "--job" ]
    device-sync:
      cmd: /opt/factum2/factum-device-sync
      args: [ "sync", "--job" ]
    dns:
      cmd: /opt/factum2/factum-dns
      args: [ "sync", "--job" ]
    icinga:
      cmd: /opt/factum2/factum-icinga
      args: [ "sync", "--job" ]
    librenms:
      cmd: /opt/factum2/factum-librenms
      args: [ "sync", "--job" ]
    lime:
      cmd: /opt/factum2/factum-lime
      args: [ "sync", "--job" ]
    netbox:
      cmd: /opt/factum2/factum-netbox
      args: [ "sync", "--job" ]
