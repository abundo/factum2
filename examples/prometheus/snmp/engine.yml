# Merged with the modules baked into the snmp_exporter image.
# Do not redefine public_v2 or the system module here.
#
# sysUpTime (SNMPv2-MIB) is TimeTicks: hundredths of a second in a 32-bit
# counter, so it wraps every 497 days. snmpEngineTime is seconds since the
# SNMP engine last incremented snmpEngineBoots, and it fits about 68 years.
# A device that does not implement this OID returns noSuchObject; the GET
# is skipped and the scrape still succeeds.
modules:
  snmp_engine:
    get:
      - 1.3.6.1.6.3.10.2.1.3.0
    metrics:
      - name: snmpEngineTime
        oid: 1.3.6.1.6.3.10.2.1.3
        type: gauge
        help: Seconds since snmpEngineBoots last changed (SNMP-FRAMEWORK-MIB::snmpEngineTime).
