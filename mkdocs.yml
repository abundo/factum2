site_name: Factum
site_description: Operator documentation for Factum
site_url: https://abundo.github.io/factum2/
repo_url: https://github.com/abundo/factum2
repo_name: abundo/factum2
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Using Factum:
      - Overview: user/index.md
      - Devices: user/devices.md
      - Services: user/services.md
      - Config: user/config.md
      - Jobs: user/jobs.md
      - Admin settings: user/settings.md
      - Software bill of materials: user/sbom.md
  - Install:
      - Production: install/index.md
      - Reverse proxy: install/reverse-proxy.md
      - Worker nodes: install/workers.md

exclude_docs: |
  *.go
  cfgmgmt-service-design.md
  wdm-roadm-optical-model.md
  generated/**
  generated/sbom.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abundo/factum2
