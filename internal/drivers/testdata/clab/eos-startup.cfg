! Startup config for the cEOS nodes in eos.clab.yml.
!
! Everything here exists to turn on what the driver needs and containerlab's
! default cEOS config doesn't provide: an admin account with a known password,
! eAPI, and the OpenConfig/NETCONF agent. Management0 addressing is left to
! containerlab, which configures it when the node boots.

username admin privilege 15 role network-admin secret 0 admin
!
! Without this, an eAPI session starts at privilege level 1 no matter what
! privilege the local username has, and "show running-config"/"configure"
! come back as "Invalid input (privileged mode required)" - so the eAPI
! transport could only run unprivileged shows. A normally-configured Arista
! has this; the lab needs it too or it tests the driver against a device it
! would never meet in production.
aaa authorization exec default local
!
! eAPI over HTTPS on 443 (driver_arista_eos.go's CLI-shaped transport, and its
! fallback when NETCONF is unreachable). "no shutdown" under the mode is the
! part that's off by default.
management api http-commands
   protocol https
   no shutdown
!
! NETCONF over SSH on 830, plus the OpenConfig models the driver reads and
! edits (openconfig-interfaces). Also off by default - which is exactly why
! driver_arista_eos.go has an eAPI fallback at all.
management api netconf
   transport ssh netconf
!
management api models
   provider aaa
      no shutdown
   provider eos-native
      no shutdown
!
! Give the tested interfaces an identity to read back. Ethernet1 is the linked
! port between sw1 and sw2, so it can reach oper-status UP - and it's what
! FACTUM_TEST_EOS_IFACE defaults to, so the write tests will overwrite this
! description and restore it.
interface Ethernet1
   description lab link to sw2
   no shutdown
!
! A subinterface, so the tests cover the parent/subinterface split both
! transports have to agree on (splitSubinterface, subinterfacesFromOcData).
interface Ethernet2
   description subinterface parent
   no switchport
   no shutdown
!
interface Ethernet2.210
   description lab subinterface
   encapsulation dot1q vlan 210
   ip address 10.210.0.1/30
!
end
