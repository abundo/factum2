# NetBox inventory for the compose lab, applied by:
#   ./dev/netbox-seed.sh [file]
# or automatically from seed.py when this file is copied to netbox-seed.yaml.
#
# Copy this file to netbox-seed.yaml (gitignored) and edit. The local copy is
# not checked in — it can hold non-public names, serials, and sites.
#
# Idempotent: existing objects (matched by slug/name) are left in place.
# Interface lists on a device type become NetBox interface templates; new
# devices get those ports, and missing ports are added on devices we touch.
#
# Device-level `interfaces` overlay the device type by name (type is optional
# when the port already exists). Each port may list `ip_addresses` as CIDR
# strings or mappings. Set `primary: true` on at most one IPv4 and one IPv6
# per device to set primary_ip4 / primary_ip6. `ip:` is a single-address
# shorthand; `primary: true` on the port marks every address on that port.
#
#   interfaces:
#     - name: Loopback0
#       ip_addresses:
#         - address: 192.0.2.1/32
#           primary: true
#         - address: 2001:db8::1/128
#           primary: true
#     - name: Management1
#       ip: 192.0.2.10/24
#
# Extra keys on any object are passed through to the REST payload (description,
# serial, custom_fields, tags, u_height, …). Devices get dest-sync flags
# backup_oxidized / monitor_grafana / monitor_icinga / monitor_librenms = true
# unless defaults.custom_fields or the device's custom_fields override them.
#
# Common interface types:
#   1000base-t, 10gbase-x-sfpp, 25gbase-x-sfp28,
#   40gbase-x-qsfpp, 100gbase-x-qsfp28, 400gbase-x-qsfpdd, virtual, lag

defaults:
  site: Lab
  role: Router
  status: active

sites:
  - name: Lab
    slug: lab

device_roles:
  - name: Router
    slug: router
    color: "9e9e9e"

manufacturers:
  - Arista
  - Cisco
  - Nokia

platforms:
  - name: EOS
    manufacturer: Arista
  - name: IOS-XR
    manufacturer: Cisco
  - name: SROS-MD
    manufacturer: Nokia

device_types:
  - model: DCS-7020SR-24C2-F
    manufacturer: Arista
    u_height: 1
    interfaces:
      - { name: Ethernet1, type: 10gbase-x-sfpp }
      - { name: Ethernet2, type: 10gbase-x-sfpp }
      - { name: Ethernet3, type: 10gbase-x-sfpp }
      - { name: Ethernet4, type: 10gbase-x-sfpp }
      - { name: Ethernet5, type: 10gbase-x-sfpp }
      - { name: Ethernet6, type: 10gbase-x-sfpp }
      - { name: Ethernet7, type: 10gbase-x-sfpp }
      - { name: Ethernet8, type: 10gbase-x-sfpp }
      - { name: Ethernet9, type: 10gbase-x-sfpp }
      - { name: Ethernet10, type: 10gbase-x-sfpp }
      - { name: Ethernet25/1, type: 100gbase-x-qsfp28 }
      - { name: Ethernet26/1, type: 100gbase-x-qsfp28 }
      - { name: Management1, type: 1000base-t, mgmt_only: true }
      - { name: Loopback0, type: virtual }
  - model: DCS-7280SR2K-48C6-M-F
    manufacturer: Arista
    u_height: 1
    interfaces:
      - { name: Ethernet1, type: 10gbase-x-sfpp }
      - { name: Ethernet2, type: 10gbase-x-sfpp }
      - { name: Ethernet3, type: 10gbase-x-sfpp }
      - { name: Ethernet4, type: 10gbase-x-sfpp }
      - { name: Ethernet5, type: 10gbase-x-sfpp }
      - { name: Ethernet6, type: 10gbase-x-sfpp }
      - { name: Ethernet7, type: 10gbase-x-sfpp }
      - { name: Ethernet8, type: 10gbase-x-sfpp }
      - { name: Ethernet9, type: 10gbase-x-sfpp }
      - { name: Ethernet49/1, type: 100gbase-x-qsfp28 }
      - { name: Ethernet50/1, type: 100gbase-x-qsfp28 }
      - { name: Ethernet51/1, type: 100gbase-x-qsfp28 }
      - { name: Ethernet52/1, type: 100gbase-x-qsfp28 }
      - { name: Management1, type: 1000base-t, mgmt_only: true }
      - { name: Loopback0, type: virtual }
  - model: ASR9001
    manufacturer: Cisco
    u_height: 2
    interfaces:
      - { name: TenGigE0/0/0/0, type: 10gbase-x-sfpp }
      - { name: TenGigE0/0/0/1, type: 10gbase-x-sfpp }
      - { name: TenGigE0/0/0/2, type: 10gbase-x-sfpp }
      - { name: TenGigE0/0/0/3, type: 10gbase-x-sfpp }
      - { name: MgmtEth0/RSP0/CPU0/0, type: 1000base-t, mgmt_only: true }
      - { name: Loopback0, type: virtual }

devices:
  - name: lu17-lab-r0
    manufacturer: Arista
    device_type: DCS-7020SR-24C2-F
    platform: EOS
    interfaces:
      - name: Loopback0
        ip_addresses:
          - address: 192.0.2.1/32
            primary: true
          - address: 2001:db8::1/128
            primary: true
      - name: Management1
        ip: 192.0.2.10/24
  - name: lu17-lab-r2
    manufacturer: Arista
    device_type: DCS-7280SR2K-48C6-M-F
    platform: EOS
