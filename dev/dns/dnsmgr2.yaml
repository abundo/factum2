---
# Administrator-managed dnsmgr2 config for the lab. factum2-dns writes
# /etc/dnsmgr2/zones.yaml and /etc/dnsmgr2/prefixes.yaml and does not
# overwrite this file.
default_domain: lab.example
dbfile: /var/lib/dnsmgr2/dnsmgr2.sqlite

sources:
    - type: json
      name: /etc/dnsmgr2/records

destinations:
    - type: dns_isc_bind
      name: isc_bind

dns:
    host_templates:
        isc_bind:
            type: isc_bind
            configdir: /etc/bind
            includefile: named.conf.dnsmgr2
            zonesdir: /var/lib/bind
            zonesfile: "{zone}"
            tmpdir: /var/lib/dnsmgr2
            cmd_reload_all: "rndc -k /etc/bind/rndc.key reload"
            cmd_reload_zone: "rndc -k /etc/bind/rndc.key reload {zone}"
            cmd_restart: "rndc -k /etc/bind/rndc.key reconfig"

    soa_templates:
        default_soa:
            mname: ns1.lab.example.
            rname: hostmaster.lab.example.
            serial_format: date_serial
            refresh: 36000
            retry: 3600
            expire: 604800
            minimum: 900

    zone_templates:
        default_dns:
            soa: default_soa
            default_ttl: 900
            ns:
                - { name: "@", type: "NS", value: "ns1.lab.example." }

dhcp:
    domain_name: lab.example
    dns_servers:
        - 192.0.2.1
    host_templates:
        isc_kea:
            type: isc_kea
            ipv4:
                enable: true
                configdir: /etc/kea
                includefile: kea-dhcp4.dnsmgr2.json
                tmpdir: /var/lib/dnsmgr2
                cmd_restart: /usr/local/sbin/kea-dhcp4-reload
                cmd_status: /usr/local/sbin/kea-dhcp4-reload status
            ipv6:
                enable: false
                configdir: /etc/kea
                includefile: kea-dhcp6.dnsmgr2.json
                tmpdir: /var/lib/dnsmgr2
                cmd_restart: /usr/local/sbin/kea-dhcp4-reload
                cmd_status: /usr/local/sbin/kea-dhcp4-reload status

dnsmgr2:
    - host_dns_template: isc_bind
    - include: /etc/dnsmgr2/zones.yaml
    # Lab clients use 192.0.2.0/24 on br-lab-dhcp. Do not also enable that
    # prefix in IPAM (dnsmgr2 rejects duplicate DHCP prefixes). Extra IPAM
    # prefixes are merged from prefixes.yaml.
    - host_dhcp_template: isc_kea
      prefixes:
          - name: 192.0.2.0/24
            range: 192.0.2.100-192.0.2.199
            gateway: 192.0.2.1
    - include: /etc/dnsmgr2/prefixes.yaml
