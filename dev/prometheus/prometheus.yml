global:
  scrape_interval: 1m
  evaluation_interval: 1m

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: snmp-exporter
    static_configs:
      - targets:
          - snmp-exporter:9116

  # factum2-prometheus writes file_sd JSON. targets is the primary IPv4
  # (snmp_exporter dials it; DNS is not required). The device label is the
  # FQDN display name. Relabel copies that IP into instance and sends the
  # scrape through snmp-exporter. if_mib is interfaces/traffic; system is
  # sysName/sysUpTime/sysLocation like a LibreNMS device page. snmp_engine
  # is snmpEngineTime (seconds). sysUpTime wraps every 497 days.
  - job_name: snmp
    metrics_path: /snmp
    scrape_timeout: 25s
    honor_labels: true
    params:
      module:
        - if_mib
        - system
        - snmp_engine
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [auth]
        target_label: __param_auth
      - target_label: __address__
        replacement: snmp-exporter:9116
    # factum2-prometheus rewrites the factum-if-ignore block from Settings
    # "Ignore interfaces". A sample whose ifName, ifDescr, or ifAlias matches
    # is dropped before it is stored. The lab loads runtime.yml, a copy of
    # this file, so the rewrite is not on the read-only mount.
    metric_relabel_configs:
      # factum-if-ignore:begin
      - source_labels: [ifName]
        regex: "a^"
        action: drop
      - source_labels: [ifDescr]
        regex: "a^"
        action: drop
      - source_labels: [ifAlias]
        regex: "a^"
        action: drop
      # factum-if-ignore:end
