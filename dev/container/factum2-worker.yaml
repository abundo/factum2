---
# Primary-side worker (NetBox / device-sync). Dest CLIs run on their own
# dest containers as remote workers — see factum2-*-worker.yaml.
# factum.url is unix-socket fallback; CLIs co-located here use api.sock.
factum:
    url: http://factum-web:8091
    token: lab-factum-api-token-not-for-production

worker:
    listen: ":8443"
    token: lab-worker-token
    tls_cert: /etc/factum2/certs/hub.crt
    tls_key: /etc/factum2/certs/hub.key
    commands:
        netbox:
            cmd: /opt/factum2/factum2-netbox
            args: ["sync", "--job"]
        device-sync:
            cmd: /opt/factum2/factum2-device-sync
            args: ["sync", "--job"]
