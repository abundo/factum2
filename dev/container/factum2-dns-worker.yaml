---
# Worker co-located with BIND and Kea in the dns container.
# dns: factum2-dns writes records + zones.yaml + prefixes.yaml, then applies BIND/Kea.
# certs: factum2-certs writes .lego.yaml/.env and runs lego (RFC2136 against this named).
factum:
    url: http://factum-web:8091
    token: lab-factum-api-token-not-for-production

worker:
    listen: ":8443"
    token: lab-dns-worker-token
    tls_cert: /etc/factum2/certs/hub.crt
    tls_key: /etc/factum2/certs/hub.key
    commands:
        dns:
            cmd: /opt/factum2/factum2-dns
            args: ["sync", "--job"]
        certs:
            cmd: /opt/factum2/factum2-certs
            args: ["sync", "--job"]
