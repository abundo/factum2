# Laptop lab for factum: one Postgres (factum2 + netbox), one MariaDB
# (librenms + icingadb + icingaweb), one Redis (netbox tasks/cache + librenms),
# a dedicated Redis for Icinga DB, then the apps.
#
# NetBox stays empty unless seed.py --demo (SQL dump matching NETBOX_VERSION)
# or a local netbox-seed.yaml is applied via the REST API. postgres/init
# loads the dump on first volume init only when prepare.py --demo ran.
#
# Not the live instance (port 8090 / DB factum2 on postgresql-db-1) and not
# testdata/itest. Published on all interfaces (lab credentials). See README.md.
#
# Usage: ./compose.sh up -d --wait   (or make -C .. dev-up)
name: factum-dev

x-lab-restart: &lab-restart
  restart: unless-stopped

# Host build/ is bind-mounted at /opt/factum2. install.py --source --compose
# rebuilds those binaries and restarts factum-web / factum-worker and every
# dest that runs a co-located factum2-worker (dns, icinga, librenms,
# oxidized, prometheus).
x-factum: &factum
  <<: *lab-restart
  image: factum-dev:local
  build:
    context: .
    dockerfile: Dockerfile.factum
  working_dir: /var/factum
  volumes:
    - ../build:/opt/factum2:z,ro
    - ../web/static:/var/factum/web/static:z,ro
    - ./container/factum2.yaml:/etc/factum2/factum2.yaml:z,ro
    - ./container/factum2-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
    - ./certs:/etc/factum2/certs:z,ro
  environment:
    APP_ENV: development
    TZ: UTC

services:
  postgres:
    <<: *lab-restart
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factum2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factum2}
      POSTGRES_DB: ${POSTGRES_DB:-factum2}
    ports:
      - "15432:5432"
    volumes:
      # PG 18+ VOLUME is /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:z,ro
      # SQL dump fetched by prepare.py --demo / netbox-demo-fetch.sh
      - ./data/netbox:/netbox-demo:z,ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  mysql:
    <<: *lab-restart
    image: docker.io/mariadb:10.11
    command:
      - mysqld
      - --innodb-file-per-table=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-librenms}
      MARIADB_USER: ${MYSQL_USER:-librenms}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-librenms}
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Extra DBs/users for Icinga Web (runs only on first volume init).
      - ./mysql/init:/docker-entrypoint-initdb.d:z,ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  redis:
    <<: *lab-restart
    image: docker.io/redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  netbox: &netbox
    <<: *lab-restart
    image: docker.io/netboxcommunity/netbox:${NETBOX_VERSION:-v4.6.10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18000:8080"
    environment:
      ALLOWED_HOSTS: "*"
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: ${NETBOX_DB_USER:-netbox}
      DB_PASSWORD: ${NETBOX_DB_PASSWORD:-netbox}
      DB_WAIT_TIMEOUT: "5"
      MAX_DB_WAIT_TIME: "180"
      REDIS_HOST: redis
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ""
      REDIS_CACHE_HOST: redis
      REDIS_CACHE_DATABASE: "1"
      REDIS_CACHE_PASSWORD: ""
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME:-admin}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD:-admin}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL:-admin@lab.example}
      SUPERUSER_API_TOKEN: ${NETBOX_SUPERUSER_API_TOKEN}
      API_TOKEN_PEPPER_1: ${NETBOX_API_TOKEN_PEPPER_1:-lab-api-token-pepper-1-not-for-production-use-change-me-50ch}
      CORS_ORIGIN_ALLOW_ALL: "true"
      GRAPHQL_ENABLED: "true"
      WEBHOOKS_ENABLED: "true"
      CENSUS_REPORTING_ENABLED: "false"
      COPILOT_ENABLED: "false"
      ISOLATED_DEPLOYMENT: "true"
      RELEASE_CHECK_URL: ""
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:18000 http://localhost:18000 http://netbox:8080"
      # One worker keeps RAM down. Backpressure must stay well above 1:
      # Granian treats it as max concurrent connections, and HTTP keep-alive
      # healthchecks otherwise occupy the only slot so /login and the UI hang.
      GRANIAN_WORKERS: "1"
      GRANIAN_BACKPRESSURE: "64"
      # launch-netbox.sh binds :: ; extra --host makes IPv4 (127.0.0.1) work.
      GRANIAN_EXTRA_ARGS: "--host=0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:8080/login/"]
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  netbox-worker:
    <<: *netbox
    ports: []
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f rqworker >/dev/null"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    depends_on:
      netbox:
        condition: service_healthy

  librenms:
    <<: *lab-restart
    image: factum-dev-librenms:local
    build:
      context: .
      dockerfile: Dockerfile.librenms
      args:
        LIBRENMS_VERSION: ${LIBRENMS_VERSION:-26.8.2}
    hostname: librenms
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18001:8000"
      - "18446:8443"
    volumes:
      - librenms-data:/data
      - ../build:/opt/factum2:z,ro
      - ./container/factum2-librenms-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
      - ./certs:/etc/factum2/certs:z,ro
      - ./librenms/98-lab-tune.sh:/etc/cont-init.d/98-lab-tune.sh:z,ro
      - ./librenms/99-factum-worker.sh:/etc/cont-init.d/99-factum-worker.sh:z,ro
    environment:
      TZ: UTC
      PUID: "1000"
      PGID: "1000"
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-librenms}
      # mysql is already healthy via depends_on; keep this short.
      DB_TIMEOUT: "30"
      REDIS_HOST: redis
      REDIS_DB: "2"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      # Image writes INSTALL=user,finish on empty DB; seed.py creates admin.
      INSTALL: "false"
      MEMORY_LIMIT: 256M
      MAX_INPUT_VARS: "1000"
      UPLOAD_MAX_SIZE: 8M
      # Image defaults (15 children / opcache 128 / nginx auto) are sized for
      # a real NMS box; on a 20-core laptop that forks ~20 nginx workers.
      FPM_PM_MAX_CHILDREN: "2"
      FPM_PM_START_SERVERS: "1"
      FPM_PM_MIN_SPARE_SERVERS: "1"
      FPM_PM_MAX_SPARE_SERVERS: "2"
      OPCACHE_MEM_SIZE: "64"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:8000/login && test -S /run/factum2-worker/api.sock"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m

  librenms-dispatcher:
    <<: *lab-restart
    image: docker.io/librenms/librenms:${LIBRENMS_VERSION:-26.8.2}
    hostname: librenms-dispatcher
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      librenms:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - librenms-data:/data
    environment:
      TZ: UTC
      PUID: "1000"
      PGID: "1000"
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-librenms}
      DB_TIMEOUT: "30"
      REDIS_HOST: redis
      REDIS_DB: "2"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      DISPATCHER_NODE_ID: dispatcher1
      SIDECAR_DISPATCHER: "1"
      MEMORY_LIMIT: 256M
    mem_limit: 384m

  icinga:
    <<: *lab-restart
    image: docker.io/icinga/icinga2:2.16.5
    hostname: icinga
    user: "0"
    entrypoint: ["/usr/bin/dumb-init", "-c", "--", "/factum-lab/entrypoint.sh"]
    environment:
      ICINGA_MASTER: "1"
    ports:
      - "15665:5665"
      - "18445:8443"
    volumes:
      - icinga-data:/data
      - ./data/icinga:/factum:z
      - ../build:/opt/factum2:z,ro
      - ./container/factum2-icinga-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
      - ./certs:/etc/factum2/certs:z,ro
      - ./icinga/entrypoint.sh:/factum-lab/entrypoint.sh:z,ro
    depends_on:
      icingadb-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "icinga2 daemon -C >/dev/null && test -S /run/factum2-worker/api.sock"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 256m

  # Icinga DB message bus. Not the shared Redis (netbox/librenms keys).
  icingadb-redis:
    <<: *lab-restart
    image: docker.io/redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 64m

  icingadb:
    <<: *lab-restart
    image: docker.io/icinga/icingadb:1.5.1
    depends_on:
      mysql:
        condition: service_healthy
      icingadb-redis:
        condition: service_healthy
    environment:
      ICINGADB_DATABASE_HOST: mysql
      ICINGADB_DATABASE_PORT: "3306"
      ICINGADB_DATABASE_DATABASE: icingadb
      ICINGADB_DATABASE_USER: icingadb
      ICINGADB_DATABASE_PASSWORD: icingadb
      ICINGADB_REDIS_HOST: icingadb-redis
      ICINGADB_REDIS_PORT: "6379"
    mem_limit: 64m

  icingaweb:
    <<: *lab-restart
    image: docker.io/icinga/icingaweb2:2.14.0
    depends_on:
      mysql:
        condition: service_healthy
      icingadb-redis:
        condition: service_healthy
      icinga:
        condition: service_healthy
    ports:
      - "18002:8080"
    environment:
      icingaweb.enabledModules: icingadb
      icingaweb.passwords.icingaweb2.admin: admin
      icingaweb.authentication.icingaweb2.backend: db
      icingaweb.authentication.icingaweb2.resource: icingaweb_db
      icingaweb.config.global.config_backend: db
      icingaweb.config.global.config_resource: icingaweb_db
      icingaweb.config.logging.log: php
      icingaweb.groups.icingaweb2.backend: db
      icingaweb.groups.icingaweb2.resource: icingaweb_db
      icingaweb.modules.icingadb.config.icingadb.resource: icingadb
      icingaweb.modules.icingadb.redis.redis1.host: icingadb-redis
      icingaweb.modules.icingadb.redis.redis1.port: "6379"
      icingaweb.modules.icingadb.commandtransports.icinga2.transport: api
      icingaweb.modules.icingadb.commandtransports.icinga2.host: icinga
      icingaweb.modules.icingadb.commandtransports.icinga2.port: "5665"
      icingaweb.modules.icingadb.commandtransports.icinga2.username: factum
      icingaweb.modules.icingadb.commandtransports.icinga2.password: factum
      icingaweb.resources.icingaweb_db.type: db
      icingaweb.resources.icingaweb_db.db: mysql
      icingaweb.resources.icingaweb_db.host: mysql
      icingaweb.resources.icingaweb_db.dbname: icingaweb
      icingaweb.resources.icingaweb_db.username: icingaweb
      icingaweb.resources.icingaweb_db.password: icingaweb
      icingaweb.resources.icingaweb_db.charset: utf8mb4
      icingaweb.resources.icingadb.type: db
      icingaweb.resources.icingadb.db: mysql
      icingaweb.resources.icingadb.host: mysql
      icingaweb.resources.icingadb.dbname: icingadb
      icingaweb.resources.icingadb.username: icingadb
      icingaweb.resources.icingadb.password: icingadb
      icingaweb.resources.icingadb.charset: utf8mb4
      icingaweb.roles.Administrators.users: admin
      icingaweb.roles.Administrators.permissions: "*"
      icingaweb.roles.Administrators.groups: Administrators
    volumes:
      - icingaweb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 384m

  oxidized:
    <<: *lab-restart
    image: factum-dev-oxidized:local
    build:
      context: .
      dockerfile: Dockerfile.oxidized
    hostname: oxidized
    environment:
      OXIDIZED_HOME: /home/oxidized/.config/oxidized
    ports:
      - "18888:8888"
      - "18447:8443"
    volumes:
      - ./data/oxidized:/home/oxidized/.config/oxidized:z
      - ../build:/opt/factum2:z,ro
      - ./container/factum2-oxidized-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
      - ./certs:/etc/factum2/certs:z,ro
      - ./oxidized/factum-worker/run:/etc/service/factum-worker/run:z,ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8888/ >/dev/null && test -S /run/factum2-worker/api.sock"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 256m

  # Prometheus file_sd + factum2-worker (prometheus command only).
  prometheus:
    <<: *lab-restart
    image: factum-dev-prometheus:local
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    hostname: prometheus
    ports:
      - "19090:9090"
      - "18448:8443"
    volumes:
      - prometheus-data:/prometheus
      - ../build:/opt/factum2:z,ro
      - ./container/factum2-prometheus-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
      - ./certs:/etc/factum2/certs:z,ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:z,ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:z,ro
      - ./data/prometheus/targets.json:/etc/prometheus/targets.json:z
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/-/healthy >/dev/null && test -S /run/factum2-worker/api.sock"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  # BIND + dnsmgr2 + factum2-worker (dns command only). factum2-dns writes
  # /etc/dnsmgr2 then runs `dnsmgr2 sync`, which reloads named via rndc.
  dns:
    <<: *lab-restart
    image: factum-dev-dns:local
    build:
      context: .
      dockerfile: Dockerfile.dns
    hostname: dns
    ports:
      - "18053:53/udp"
      - "18053:53/tcp"
      - "18444:8443"
    volumes:
      - ../build:/opt/factum2:z,ro
      - ./container/factum2-dns-worker.yaml:/etc/factum2/factum2-worker.yaml:z,ro
      - ./certs:/etc/factum2/certs:z,ro
      - ./dns/entrypoint.sh:/entrypoint.sh:z,ro
      - ./bin/dnsmgr2:/usr/local/bin/dnsmgr2:z,ro
      - ./data/dns:/etc/dnsmgr2:z
      - ./data/bind:/etc/bind:z
      - ./data/bind-zones:/var/lib/bind:z
      - ./data/dnsmgr2:/var/lib/dnsmgr2:z
    environment:
      TZ: UTC
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rndc -k /etc/bind/rndc.key status >/dev/null && test -S /run/factum2-worker/api.sock",
        ]
      start_period: 25s
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  factum-web:
    <<: *factum
    command:
      - /opt/factum2/factum2-web
      - -f
      - /etc/factum2/factum2.yaml
      - start
      - -b
      - 0.0.0.0:8091
    ports:
      - "18091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/api/version"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  factum-worker:
    <<: *factum
    command:
      - /opt/factum2/factum2-worker
      - -f
      - /etc/factum2/factum2-worker.yaml
      - start
    ports:
      - "18443:8443"
    depends_on:
      factum-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/factum2-worker/api.sock"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 128m

  # Static index of published lab ports. Links rewrite to the hostname
  # used to open this page (so they work off-box, not only 127.0.0.1).
  portal:
    <<: *lab-restart
    image: docker.io/nginx:1.28-alpine
    ports:
      - "18080:80"
    volumes:
      - ./portal:/usr/share/nginx/html:z,ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 32m

volumes:
  postgres-data:
  mysql-data:
  librenms-data:
  icinga-data:
  icingaweb-data:
  prometheus-data:
