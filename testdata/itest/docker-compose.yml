# Everyday integration-test stack: Postgres + OpenLDAP + a mail catcher.
# Used by web/*_integration_test.go (build tag `integration`) to exercise
# internal/ldapauth and internal/mail against real servers instead of fakes.
# See DEV.md's Testing section - `make itest-up` / `make itest-down`.
#
# NetBox/LibreNMS are deliberately not here: they're each a multi-container
# app in their own right (own Postgres/MySQL+Redis), so they get a separate,
# opt-in tier instead of slowing down every run of this one - see DEV.md.
#
# Ports are non-default so this can run alongside a normal dev Postgres.
name: factum-itest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factum_test
      POSTGRES_USER: factum_test
      POSTGRES_PASSWORD: factum_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factum_test -d factum_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data # throwaway - no need to persist test data

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Factum Test"
      LDAP_DOMAIN: "factum.test" # -> base DN dc=factum,dc=test
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false" # plaintext ldap:// only - fine for a local test stack
      # Without this, the image tries to rmdir its bootstrap ldif dir after
      # loading it, which fails since ./ldap is bind-mounted there.
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "3389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=factum,dc=test", "-D", "cn=admin,dc=factum,dc=test", "-w", "admin"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11025:1025" # SMTP - point util.CommonConfig.SmtpHost/Port here
      - "18025:8025" # web UI + REST API, http://localhost:18025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
